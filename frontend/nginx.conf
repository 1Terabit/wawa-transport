server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Handle React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api requests to backend (optional, but good practice for same-domain)
    # The frontend is calling absolute URLs currently based on VITE_API_URL
    # so we don't strictly need a proxy block, but it's here for safety.
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
